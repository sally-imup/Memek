name: Build Termux VM (embedded X11)

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK, NDK and CMake
        # ubuntu-latest already ships the Android SDK at $ANDROID_HOME; use its sdkmanager
        # directly (android-actions/setup-android failed on its own sdkmanager call).
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -n 1)/sdkmanager"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y bison flex gperf pkg-config python3

      - name: Fetch embedded X server sources
        run: bash .github/scripts/fetch-lorie-submodules.sh

      - name: Build debug APK
        env:
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "0"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-vm-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
